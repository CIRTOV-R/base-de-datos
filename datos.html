<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova - Panel de Control</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="contenedor-ancho">
        <header class="encabezado-panel">
            <h2>Panel de Control - Empresa Innova</h2>
            <div style="display: flex; gap: 10px;">
                <a href="pedido.html" class="btn-primario" style="text-decoration: none; padding: 10px 15px; display:inline-block;">+ Nuevo Pedido</a>
                <button onclick="cargarTodo()" class="btn-accion">Actualizar Tablas</button>
            </div>
        </header>
        
        <section class="seccion-tabla">
            <h3>Gestión de Pedidos Recientes</h3><br>
            <table>
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Cliente (Cédula/RIF)</th>
                        <th>Productos Solicitados</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-pedidos"></tbody>
            </table>
        </section>

        <br><hr><br>

        <section class="seccion-tabla">
            <h3>Lista de Clientes</h3><br>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Empresa</th>
                        <th>Teléfono</th>
                        <th>Ciudad</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
        </section>

        <br><hr><br>

        <section class="seccion-tabla">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin: 0;">Inventario de Productos (Control de Stock)</h3>
                <button onclick="cargarProductos()" class="btn-accion" style="padding: 6px 12px; font-size: 13px;">Actualizar Inventario</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre Producto</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-productos"></tbody>
            </table>
        </section>
        
        <footer>
            <br>
            <a href="index.html" class="enlace-salir">Cerrar Sesión</a>
        </footer>
    </main>

    <script src="conexion.js"></script>
</body>
</html>
