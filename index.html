<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
    <main class="contenedor" style="max-width: 400px; margin-top: 10vh;">
        <h2>Empresa Innova</h2>
        <p class="subtitulo">Ingresa a tu cuenta para gestionar el sistema</p>
        
        <form id="form-login" style="text-align: left;">
            <div class="campo">
                <label style="font-size: 13px; font-weight: 600; color: #475569;">Correo Electrónico:</label>
                <input type="email" id="login-email" placeholder="correo@empresa.com" required>
            </div>
            
            <div class="campo" style="margin-top: 15px;">
                <label style="font-size: 13px; font-weight: 600; color: #475569;">Contraseña:</label>
                <input type="password" id="login-pass" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primario" style="margin-top: 20px; width: 100%;">Iniciar Sesión</button>
        </form>
        
        <div class="enlaces-pie" style="margin-top: 20px; text-align: center;">
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </main>

    <script src="conexion.js"></script>
</body>
</html>
